name: Daily question

on:
  schedule:
    # LeetCode rolls the daily question at 00:00 UTC. A short delay avoids the empty window.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-question
  cancel-in-progress: false

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Solve today's question
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/solve_daily.py

      - name: Commit solutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solutions
          if git diff --staged --quiet; then
            echo "No new solution to commit."
            exit 0
          fi
          git commit -m "Add LeetCode daily solution"
          git push
